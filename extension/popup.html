<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body { width: 260px; margin: 0; background: #0b1020; color: #fff; font-family: -apple-system,'Segoe UI',Roboto,Arial,sans-serif; padding: 16px; }
    h1 { font-size: 15px; font-weight: 900; margin: 0 0 4px; }
    h1 b { background: linear-gradient(135deg,#60a5fa,#a78bfa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    p { font-size: 12px; color: rgba(255,255,255,0.6); line-height: 1.55; margin: 8px 0; }
    .status { font-size: 12px; font-weight: 700; margin: 10px 0; }
    .ok { color: #34d399; } .warn { color: #fbbf24; }
    button { width: 100%; padding: 10px; border: none; border-radius: 10px; cursor: pointer; background: linear-gradient(135deg,#4f8ef7,#a78bfa); color: #fff; font-weight: 800; font-size: 13px; margin-top: 6px; }
    ol { margin: 8px 0 0 18px; padding: 0; font-size: 12px; color: rgba(255,255,255,0.6); line-height: 1.7; }
  </style>
</head>
<body>
  <h1>Drift<b>AI</b> Auto-Apply</h1>
  <div class="status" id="status"></div>
  <button id="edit">Edit my profile</button>
  <p>How it works:</p>
  <ol>
    <li>Save your profile once</li>
    <li>Open any Greenhouse / Lever / Ashby job application</li>
    <li>Click "⚡ Fill this application" in the corner</li>
    <li>Attach your resume, review, and Submit</li>
  </ol>
  <script src="popup.js"></script>
</body>
</html>
